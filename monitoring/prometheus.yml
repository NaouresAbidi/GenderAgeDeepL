global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'age-gender-api'
    static_configs:
      - targets: ['age-gender-api:5000']
    metrics_path: '/health'
    scrape_interval: 30s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']